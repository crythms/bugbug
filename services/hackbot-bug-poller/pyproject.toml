[project]
name = "hackbot-bug-poller"
version = "0.1.0"
description = "Polls Bugzilla queries and triggers the frontend-triage hackbot agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.26.0",
    "pydantic-settings>=2.1.0",
    "sentry-sdk>=2.51.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
